[build-system]
requires = [
  "scikit-build-core==1.1.1",
  "pybind11==3.1.0",
  # Ranges a source build has been tested against; an isolated build picks the newest.
  "libpinocchio>=4.0.0",
  "libcoal>=3.0.3,<3.1",
  "cmeel-eigen~=3.4.0",
  "cmeel-urdfdom-headers>=3.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "kstone"
dynamic = ["version", "dependencies"]
description = "Inverse kinematics and control for robots"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "kehuanjack", email = "1506289682@qq.com" }]
keywords = ["robotics", "inverse-kinematics", "pinocchio"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/AgilexOpensource/kstone"
Documentation = "https://github.com/AgilexOpensource/kstone/blob/main/docs/python.md"
Issues = "https://github.com/AgilexOpensource/kstone/issues"
Changelog = "https://github.com/AgilexOpensource/kstone/blob/main/CHANGELOG.md"

[project.scripts]
kstone = "kstone:_main"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/wheel/{wheel_tag}"
cmake.version = ">=3.22"
cmake.build-type = "Release"
install.components = ["python"]
wheel.packages = []

[tool.scikit-build.cmake.define]
KSTONE_BUILD_PYTHON = "ON"
KSTONE_PINOCCHIO_SOURCE = "PIP"
KSTONE_BUILD_TESTS = "OFF"
KSTONE_BUILD_TOOLS = "OFF"
KSTONE_BUILD_EXAMPLES = "OFF"
KSTONE_BUILD_BENCH = "OFF"
BUILD_SHARED_LIBS = "OFF"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "CMakeLists.txt"
regex = 'project\(kstone VERSION (?P<value>[0-9.]+)'

# The extension links the shared libraries of these wheels, so they are pinned to the versions it was built against.
[[tool.dynamic-metadata]]
provider = { path = "python/packaging", module = "kstone_deps" }
static = ["numpy>=1.22"]
